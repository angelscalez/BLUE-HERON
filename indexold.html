<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angel Dragon</title>

<style>
body {
    margin:0;
    overflow:hidden;
    font-family:Arial;
    text-align:center;
    background:linear-gradient(#78c8ff,#f5d7ff);
}

h1 {
    color:white;
    text-shadow:2px 2px 5px #333;
}

#world {
    height:55vh;
    position:relative;
}

#dragon {
    font-size:120px;
    position:absolute;
    left:50%;
    top:35%;
    transform:translate(-50%,-50%);
    animation:float 2s infinite ease-in-out;
}

@keyframes float {
    0%,100% {margin-top:0;}
    50% {margin-top:-25px;}
}

.wings {
    animation:flap .6s infinite alternate;
}

@keyframes flap {
    from {transform:scaleY(1);}
    to {transform:scaleY(.7);}
}

#stats {
    background:white;
    margin:10px;
    padding:10px;
    border-radius:15px;
}

button {
    font-size:18px;
    padding:12px;
    margin:5px;
    border-radius:15px;
    border:none;
    background:#ffd36a;
}

button:active {
    transform:scale(.9);
}

.spark {
    position:absolute;
    width:15px;
    height:15px;
    background:#fff27a;
    border-radius:50%;
    animation:magic 1.5s forwards;
}

@keyframes magic {
    from {
        opacity:1;
        transform:translateY(0);
    }
    to {
        opacity:0;
        transform:translateY(-200px);
    }
}

#message {
    color:white;
    font-size:20px;
    text-shadow:1px 1px 4px black;
}
</style>
</head>

<body>

<h1>🐉 Angel Dragon 🪽</h1>

<div id="world">
    <div id="dragon">
        🐉<span class="wings">🪽</span>
    </div>
</div>

<div id="stats">
🍖 Hunger: <span id="food">100</span><br>
💧 Thirst: <span id="water">100</span><br>
❤️ Happiness: <span id="happy">100</span>
</div>

<div id="message">
Your angel dragon is happy!
</div>

<button onclick="feed()">🍖 Feed</button>
<button onclick="drink()">💧 Water</button>
<button onclick="pet()">❤️ Pet</button>
<button onclick="magic()">✨ Magic Breath</button>

<script>

let data = JSON.parse(localStorage.getItem("dragonSave")) || {
food:100,
water:100,
happy:100
};

function save(){
localStorage.setItem("dragonSave",JSON.stringify(data));
}

function update(){

data.food=Math.max(0,data.food);
data.water=Math.max(0,data.water);
data.happy=Math.max(0,data.happy);

food.textContent=Math.floor(data.food);
water.textContent=Math.floor(data.water);
happy.textContent=Math.floor(data.happy);

save();
}

function say(text){
document.getElementById("message").innerHTML=text;
}

function feed(){
data.food+=20;
data.happy+=5;
say("🍖 Your dragon enjoys the meal!");
update();
}

function drink(){
data.water+=20;
data.happy+=5;
say("💧 Your dragon drinks fresh water!");
update();
}

function pet(){
data.happy+=10;
say("❤️ Your dragon loves the attention!");
update();
}

function magic(){

say("✨ Magical sparkles fill the sky!");

let d=document.getElementById("dragon");
let box=d.getBoundingClientRect();

for(let i=0;i<25;i++){

let s=document.createElement("div");
s.className="spark";

s.style.left=(box.left+60+Math.random()*50)+"px";
s.style.top=(box.top+50)+"px";

document.body.appendChild(s);

setTimeout(()=>{
s.remove();
},1500);

}

}

setInterval(()=>{

data.food-=1;
data.water-=1;

if(data.food<30 || data.water<30){
data.happy-=1;
}

update();

},5000);


update();

</script>

</body>
</html>
